appId: com.electron.app
productName: Flyff Universe Browser
directories:
    buildResources: build
    output: release/${version}
files:
    - '!**/.vscode/*'
    - '!src/*'
    - '!electron.vite.config.{js,ts,mjs,cjs}'
    - '!{biome.json,Taskfile.yml,dev-app-update.yml,CHANGELOG.md,README.md}'
    - '!{.env,.env.*,.npmrc,bun.lock}'
    - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
    - '!release/*'
asarUnpack:
    - resources/**
win:
    target:
        - target: nsis
          arch:
              - x64
    executableName: flyff-universe-browser
nsis:
    oneClick: false
    artifactName: ${name}-${version}.${ext}
    shortcutName: ${productName}
    uninstallDisplayName: ${productName}
    createDesktopShortcut: always
    allowToChangeInstallationDirectory: true
    deleteAppDataOnUninstall: false
mac:
    entitlementsInherit: build/entitlements.mac.plist
    # No Developer ID certificate: skip signing instead of picking up any local development certificate.
    identity: null
    notarize: false
dmg:
    artifactName: ${name}-${version}.${ext}
linux:
    target:
        - AppImage
        - deb
    maintainer: electronjs.org
    category: Utility
appImage:
    artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
    - provider: github
      owner: SpaceDose
      repo: flyff-universe-browser
